spring:
  application:
    name: nexo-campo-api
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nexocampo}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:2GB}
      max-request-size: ${MAX_REQUEST_SIZE:2GB}

server:
  port: ${SERVER_PORT:8080}

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${OPENAPI_ENABLED:false}

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  storage:
    root: ${STORAGE_ROOT:./storage}
  time-zone: ${APP_TIME_ZONE:America/Sao_Paulo}
  ai:
    # stub = respostas simuladas, sem rede | openai-compatible = provedor real (Gemini, Groq, OpenAI...)
    provider: ${AI_PROVIDER:stub}
    timeout: ${AI_TIMEOUT:60s}
    # Planos grátis devolvem 503 em picos de uso; repete só erros 5xx e de rede.
    max-attempts: ${AI_MAX_ATTEMPTS:3}
    retry-backoff: ${AI_RETRY_BACKOFF:1s}
    chat:
      base-url: ${AI_CHAT_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
      api-key: ${AI_CHAT_API_KEY:}
      # Versão fixa: os apelidos "-latest" mudam sem aviso e o Flash comum levou até 80s por resposta.
      model: ${AI_CHAT_MODEL:gemini-3.5-flash-lite}
      # false para provedores que não aceitam response_format json_schema (o schema vai no prompt)
      json-schema: ${AI_CHAT_JSON_SCHEMA:true}
    transcription:
      base-url: ${AI_TRANSCRIPTION_BASE_URL:https://api.groq.com/openai/v1}
      api-key: ${AI_TRANSCRIPTION_API_KEY:}
      model: ${AI_TRANSCRIPTION_MODEL:whisper-large-v3-turbo}
